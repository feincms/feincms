[tox]
envlist =
    py{310,311}-dj{32,41,42,50,51,52}
    py{312,313}-dj{42,50,51,52,60,61,main}
    py314-dj{52,60,61,main}
    py315-dj{61,main}

[testenv]
usedevelop = true
extras = tests
commands =
    python -Wd {envbindir}/coverage run tests/manage.py test -v2 --keepdb {posargs:testapp}
    coverage report -m
deps =
    dj32: Django>=3.2,<4.0
    dj41: Django>=4.1,<4.2
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz

[testenv:e2e]
usedevelop = true
extras = tests
commands_pre =
    playwright install chromium
commands =
    pytest -xvv -m e2e {posargs:tests/testapp/tests}
deps =
    Django>=5.2,<5.3
    pytest
    pytest-django
    pytest-playwright
    playwright
